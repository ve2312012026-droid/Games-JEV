<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Participante - Trivia Biblica</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="landing">
    <div class="card" id="join-card">
      <h1>Unirse a la partida</h1>
      <p>Ingresa tu nombre para unirte</p>
      <input type="text" id="player-name" placeholder="Tu nombre o apodo" class="input" />
      <button onclick="joinGame()" class="btn btn-primary">Entrar al juego</button>
    </div>
    <div class="card hidden" id="waiting-card">
      <h2 id="greeting">Hola</h2>
      <p>Esperando a que el administrador inicie la partida...</p>
      <div class="spinner"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
