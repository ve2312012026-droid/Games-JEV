<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Partida</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="admin-container" style="padding-bottom: 30px;">
    <div class="partida-header">
      <button class="back-btn" onclick="window.location.href='admin.html'">Volver</button>
      <h1 id="partida-title">Partida</h1>
      <p id="partida-mode" class="mode-label"></p>
    </div>

    <div id="ruleta-view" class="hidden">
      <div class="ruleta-container">
        <div class="ruleta" id="ruleta">
          <div class="ruleta-centro">Girar</div>
        </div>
      </div>
      <div style="padding: 0 20px;">
        <button class="btn btn-primary" onclick="girarRuleta()" id="btn-girar">Girar Ruleta</button>
      </div>
      <div id="pregunta-ruleta" class="pregunta-box hidden">
        <h2 id="texto-pregunta"></h2>
        <div id="opciones-ruleta" class="opciones"></div>
        <div id="resultado-ruleta" class="resultado hidden"></div>
      </div>
    </div>

    <div id="cien-view" class="hidden">
      <div class="pregunta-box">
        <h2 id="texto-pregunta-cien"></h2>
        <div id="respuestas-cien" class="respuestas-cien"></div>
        <div class="strikes">
          <span>Fallos:</span>
          <div id="strikes-container"></div>
        </div>
        <button class="btn btn-primary" onclick="revelarTodo()">Revelar todas</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const game = params.get("game") || "ruleta";
    const id = params.get("id") || "1";
    document.addEventListener("DOMContentLoaded", () => {
      iniciarPartida(game, id);
    });
  </script>
</body>
</html>
